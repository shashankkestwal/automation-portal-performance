apiVersion: locust.io/v2
kind: LocustTest
metadata:
  name: ${SCENARIO}.test
spec:
  image: quay.io/backstage-performance/locust:latest-2.x
  imagePullPolicy: Always
  master:
    command: >-
      --locustfile /lotest/src/${SCENARIO}.py
      --host ${PORTAL_URL}
      --users ${USERS}
      --spawn-rate ${SPAWN_RATE}
      --run-time ${DURATION}
      --aap-url ${AAP_URL}
      --aap-password ${AAP_PASSWORD}
      ${EE_BUILDER_LOCUST_CMD}
      ${GITHUB_USER_OAUTH_TOKEN_FLAG}
    extraArgs:
      - "--loglevel"
      - "DEBUG"
  worker:
    command: >-
      --locustfile /lotest/src/${SCENARIO}.py
      --aap-url ${AAP_URL}
      --aap-password ${AAP_PASSWORD}
      ${EE_BUILDER_LOCUST_CMD}
      ${AAP_ACCESS_TOKEN_FLAG}
      ${GITHUB_USER_OAUTH_TOKEN_FLAG}
    extraArgs:
      - "--loglevel"
      - "DEBUG"
    replicas: ${WORKERS}
  testFiles:
    configMapRef: locust.${SCENARIO}

